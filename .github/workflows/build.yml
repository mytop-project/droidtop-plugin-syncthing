name: Plugin bundle

# Build, signing and the tag release live once, in mytop-project/droidtop-platforms,
# pinned by commit (mytop-project/tracker#198). prepare.sh installs the pinned Go
# toolchain; build.sh builds upstream Syncthing for arm64-v8a and x86_64 and the
# Kotlin plugin; the sign job runs this repository's sign.sh with
# PLUGIN_SIGNING_KEY and PLUGIN_SIGNING_CERT. A tag named plugin-v* attaches the
# signed bundle to that release.
# The bundle is built from a line (plugin/<line>: creation with plugin-core written over it), never from
# plugin-core alone, which holds only the wrapper.
on:
  push:
    branches: ['plugin/**']
    tags: ['plugin-v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: write
    uses: mytop-project/droidtop-platforms/.github/workflows/droidtop-plugin-bundle.yml@0d931db42f484004b9ca7438500b725f60f2e3fc
    with:
      plugin-dir: .
      artifact-name: droidtop-plugin-syncthing
      prepare-script: prepare.sh
      payload: classes.jar lib
    secrets:
      PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
      PLUGIN_SIGNING_CERT: ${{ secrets.PLUGIN_SIGNING_CERT }}
